version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: intelliicu-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Sumeet}
      POSTGRES_DB: intelliicu
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliicu-backend
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=intelliicu
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-Sumeet}}
      - PORT=8000
      - DEBUG=False
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173,http://127.0.0.1:3000,https://intelliicu-production.up.railway.app}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-intelliicu_dev_secret_key_change_in_prod}
      - ENABLE_DEMO_SEED=${ENABLE_DEMO_SEED:-false}
      - SIMULATOR_PERSIST_DB=${SIMULATOR_PERSIST_DB:-false}
      - AI_PROVIDER=${AI_PROVIDER:-groq}
      - AI_FALLBACK_PROVIDER=${AI_FALLBACK_PROVIDER:-gemini}
      - AI_ENABLE_MOCK_FALLBACK=${AI_ENABLE_MOCK_FALLBACK:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - ./backend/vector_db:/app/vector_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/ws}
    container_name: intelliicu-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
